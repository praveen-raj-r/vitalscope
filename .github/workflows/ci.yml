name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can run; real keys are never needed in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Only Postgres is needed: it applies the migrations and seed, and the tests run in the database.
      # (`supabase start` also starts mail/API containers, which clashed on a port in CI.)
      - name: Start local Postgres and apply migrations
        run: supabase db start
        env:
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
      - name: RLS tests (pgTAP)
        run: supabase test db

  e2e:
    # A real browser loads the demo page with the real SDK and the real ingest logic. Runs on pushes to main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vitalscope/sdk build
      - run: pnpm --filter @vitalscope/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @vitalscope/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
