name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Keep in mind the project's constraints: the SDK has a **5 KB gzipped budget** and one dependency, and it collects **no cookies, IP addresses or user ids**. Requests that fit those are much easier to say yes to.
  - type: dropdown
    id: area
    attributes:
      label: Which part would it change?
      options:
        - SDK
        - Dashboard
        - Public demo
        - Landing page
        - Ingest or the database
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: cost
    attributes:
      label: Costs and trade-offs
      description: If you can, say what it would cost (SDK size, extra data collected, more database queries).
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to open a pull request for this.
