<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitalscope demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1.5rem; }
      #hero { width: 100%; height: 12rem; background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 0.5rem; }
      button, a.button { margin: 0.5rem 0.5rem 0 0; padding: 0.5rem 1rem; }
    </style>
  </head>
  <body>
    <h1>Vitalscope demo</h1>
    <p>A page that loads the SDK. Use the buttons to produce a slow interaction or a layout shift, then navigate away or switch tabs to send the beacon.</p>
    <div id="hero" role="img" aria-label="Hero banner"></div>
    <div id="slot"></div>
    <button id="slow" type="button">Slow click (blocks ~300 ms)</button>
    <button id="shift" type="button">Cause layout shift</button>
    <a class="button" href="about:blank">Navigate away</a>
    <pre id="status" aria-live="polite"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
